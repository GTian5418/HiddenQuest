org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
# Gradle 8.9 daemon on Windows hangs client<->daemon RPC after build finishes,
# leaving the terminal looking stuck while the daemon sits idle in awaitStop.
# --no-daemon runs in a single-use JVM that exits when the build ends.
org.gradle.daemon=false
kotlin.compiler.execution.strategy=in-process
